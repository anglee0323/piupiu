# 公开仓库的标准托管机器免费、不占额度：每次推送和 PR 都在 Linux 和 Windows 上各跑一遍
# 装依赖 → 后端测试 → 构建界面 → 模拟盘冒烟。Windows 覆盖跨平台兼容（baw 的调用方式、路径、npm 脚本）。
# 真实钱包登录 / 下单仍需真机验证。同一分支的旧运行会被新推送取消；只改文档不触发。
# 此文件只在开源版里使用（导出时覆盖私有仓库的同名文件）。
name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  schedule:
    - cron: '40 3 * * 1'   # 每周一兜底跑一次
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm install
      - run: npm test
      - run: npm run web:build
      - run: node scripts/smoke.mjs
